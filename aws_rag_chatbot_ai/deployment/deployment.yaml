apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-rag-chatbot
  namespace: chatbot
  labels:
    app: aws-rag-chatbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aws-rag-chatbot
  template:
    metadata:
      labels:
        app: aws-rag-chatbot
    spec:
      imagePullSecrets:
        - name: regcred
      terminationGracePeriodSeconds: 30
      containers:
        - name: aws-rag-chatbot
          image: docker.io/nhqb3197/aws_rag_chatbot_ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http-frontend
            - containerPort: 8000
              name: http-backend
          envFrom:
            - configMapRef:
                name: aws-rag-chatbot-config
            # Sensitive values should be provided via a Kubernetes Secret named
            # `aws-rag-chatbot-secret` in the target namespace. Create it using
            # the kubectl commands shown in the repository README or below.
            - secretRef:
                name: aws-rag-chatbot-secret
          readinessProbe:
            httpGet:
              path: /
              port: http-frontend
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http-frontend
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "1000m"
              memory: "2500Mi"
            limits:
              cpu: "4000m"
              memory: "5Gi"
