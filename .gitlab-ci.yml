stages:
  - build
  - sync

variables:
  APP_DIR: "."
  DOCKERHUB_USERNAME: "nhqb3197"
  DOCKERHUB_TOKEN: "regcred"
  DOCKERHUB_IMAGE: "$DOCKERHUB_USERNAME/aws_rag_chatbot_ai"
  ARGOCD_BASE_URL: "http://argocd-server.argocd.svc.cluster.local"
  ARGOCD_SERVER: "argocd-server.argocd.svc.cluster.local:80"
  # Prefer storing the ArgoCD token in a Kubernetes Secret and letting CI read it from cluster.
  # If you still want to set the ArgoCD token in CI variables, leave ARGOCD_AUTH_TOKEN set there.
  ARGOCD_AUTH_TOKEN: ""
  ARGOCD_AUTH_SECRET: "argocd-auth"
  ARGOCD_AUTH_SECRET_NS: "argocd"
  ARGOCD_APP: "aws-rag-chatbot-ai"
  ARGOCD_PLAINTEXT: true

build-and-push:
  stage: build
  tags: ["k8s"]
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH'
  script:
    - echo "IMAGE_TAG=latest" > build.env
    - |
      if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
        echo "ERROR: Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in CI/CD variables" >&2
        exit 1
      fi
    - |
      if [ ! -f "$APP_DIR/Dockerfile" ]; then
        echo "ERROR: No Dockerfile at $APP_DIR" >&2
        exit 1
      fi
    - |
      mkdir -p /kaniko/.docker
      cat > /kaniko/.docker/config.json <<EOF
      {"auths": {"https://index.docker.io/v1/": {"username": "$DOCKERHUB_USERNAME", "password": "$DOCKERHUB_TOKEN"}}}
      EOF
    - |
      IMAGE_TAG=latest
      DEST_ARGS="--destination docker.io/$DOCKERHUB_IMAGE:latest"
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile $CI_PROJECT_DIR/$APP_DIR/Dockerfile \
        --cache=true \
        $DEST_ARGS
  artifacts:
    reports:
      dotenv: build.env
    when: on_success

argocd-sync:
  stage: sync
  tags: ["k8s"]
  image: bitnami/kubectl:1.29.6
  needs: ["build-and-push"]
  rules:
    - if: '$CI_COMMIT_BRANCH'
  script:
    - |
      set -e
      : "${ARGOCD_BASE_URL:=http://argocd-server.argocd.svc.cluster.local}"
      : "${ARGOCD_APP:=react-nginx-dev}"
      # If ARGOCD_AUTH_TOKEN is not set as a CI variable, try reading it from a Kubernetes Secret
      if [ -z "${ARGOCD_AUTH_TOKEN:-}" ]; then
        if kubectl get secret "${ARGOCD_AUTH_SECRET}" -n "${ARGOCD_AUTH_SECRET_NS}" >/dev/null 2>&1; then
          ARGOCD_AUTH_TOKEN=$(kubectl -n "${ARGOCD_AUTH_SECRET_NS}" get secret "${ARGOCD_AUTH_SECRET}" -o jsonpath='{.data.token}' | base64 -d)
          echo "Fetched ARGOCD token from k8s secret ${ARGOCD_AUTH_SECRET}/${ARGOCD_AUTH_SECRET_NS}" >&2
        else
          echo "ERROR: ARGOCD_AUTH_TOKEN not set and Kubernetes secret ${ARGOCD_AUTH_SECRET} not found in namespace ${ARGOCD_AUTH_SECRET_NS}" >&2
          exit 1
        fi
      fi

      # Ensure curl is available in this image; install if needed
      if ! command -v curl >/dev/null 2>&1; then
        apt-get update && apt-get install -y --no-install-recommends curl ca-certificates >/dev/null 2>&1 || true
      fi
      curl -fsS -X POST \
        -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
        -H "Content-Type: application/json" \
        "${ARGOCD_BASE_URL}/api/v1/applications/${ARGOCD_APP}/refresh" \
        -d '{"hard":true}'
      curl -fsS -X POST \
        -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
        -H "Content-Type: application/json" \
        "${ARGOCD_BASE_URL}/api/v1/applications/${ARGOCD_APP}/sync" \
        -d '{}'